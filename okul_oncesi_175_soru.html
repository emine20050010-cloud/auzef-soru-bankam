rkezli Program Tasarımı Yaklaşımı", "Hedefler/Amaçlar/Kazanımlar/Öğrenme Çıktıları"], "answer": 2, "source": "Kitap içeriğinden oluşturulan çalışma sorusu"}, {"q": "Ders kitabındaki aşağıdaki açıklama en çok hangi başlıkla ilişkilidir? “Konu merkezli yaklaşımlar eğitim-öğretim uygulamalarında en yaygın olarak kullanılan tasarım yaklaşımlarından biridir.”", "options": ["Eğitimi Etkileyen Temel Felsefi Akımlar", "Ölçme ve Değerlendirme", "Türkiye’de Uygulanmış ve Uygulamada Olan Okul Öncesi Eğitim Programlarının", "Erken Çocukluk Eğitim Programlarının İlkeleri", "Konu Merkezli Program Tasarımı Yaklaşımı"], "answer": 4, "source": "Kitap içeriğinden oluşturulan çalışma sorusu"}, {"q": "Ders kitabındaki aşağıdaki açıklama en çok hangi başlıkla ilişkilidir? “Öğrenen merkezli tasarımlar, programın alıcısı olarak çocukların programın merkezinde olması gerektiğini vurgulanır.”", "options": ["Eğitim Programı Tasarımı", "Eğitimle İlgili Temel Kavramlar", "Eğitimi Etkileyen Temel Felsefi Akımlar", "Program Geliştirmede Yeni Yönelimler", "Öğrenen Merkezli Program Tasarımı Yaklaşımı"], "answer": 4, "source": "Kitap içeriğinden oluşturulan çalışma sorusu"}]}, {"name": "Okul Öncesi Eğitim Programlarının Tarihsel Gelişimi-I", "questions": [{"q": "Aşağıdaki verilenlerden hangisi “tematik” olarak hazırlanmış okul öncesi programıdır?", "options": ["1952 Okul Öncesi Eğitim Programı", "1989 Okul Öncesi Eğitim Programı", "1994 Okul Öncesi Eğitim Programı", "2002 Okul Öncesi Eğitim Programı", "2006 Okul Öncesi Eğitim Programı"], "answer": 1, "source": "Kitaptaki ünite sorusu"}, {"q": "“0-36 aylık çocukların eğitimi için Kreş Programı; 37-60 ay çocukların eğitimi için Anaokulu Programı ve 61- 72 aylık çocukların eğitimi için Anasınıfı Programı” olarak üç ayrı programın hazırlandığı okul öncesi programı ağıdakilerden hangisidir?", "options": ["1952 Okul Öncesi Eğitim Programı", "1989 Okul Öncesi Eğitim Programı", "1994 Okul Öncesi Eğitim Programı", "2002 Okul Öncesi Eğitim Programı", "2006 O
