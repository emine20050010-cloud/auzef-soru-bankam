<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244db5"><title>AUZEF Soru Bankam</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f2f5fb;color:#20304a}header{background:#244db5;color:#fff;padding:26px 18px;text-align:center}header h1{font-size:1.8rem;margin:0 0 8px}header p{margin:0;opacity:.9}main{max-width:650px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 3px 15px #172a5210}button{border:0;border-radius:10px;padding:14px 16px;font-size:1rem;cursor:pointer}button.primary{background:#244db5;color:#fff;width:100%;margin:6px 0;text-align:left}button.secondary{background:#e9eef9;color:#244db5;margin-bottom:12px}button.option{background:#edf2ff;color:#20304a;display:block;width:100%;text-align:left;margin:9px 0}button:disabled{opacity:.75}button.correct{background:#c6efcf}button.wrong{background:#ffd4d4}.muted{color:#617089}.tag{font-size:.8rem;color:#526481;background:#edf2ff;padding:5px 9px;border-radius:20px}.hidden{display:none}.progress{font-size:.9rem;color:#65758e;margin-bottom:10px}</style></head><body>
<header><h1>📚 AUZEF Soru Bankam</h1><p>Çocuk Gelişimi • 3. Sınıf</p></header><main><div class="card"><button id="back" class="secondary hidden">← Geri</button><div id="content"></div></div><div class="card"><strong>Bilgilendirme</strong><p class="muted">Bu sürüm menüleri ve test sistemini göstermek içindir. Örnek soru gerçek AUZEF çıkmış sorusu değildir. Gerçek sınav arşivleri doğrulanarak eklenecektir. Resmî AUZEF uygulaması değildir.</p></div></main>
<script>
const courses=[{id:'demo',name:'Örnek Ders (Demo)',term:'Demo'}];
const exams=[{course:'demo',year:2025,type:'Vize',questions:[{q:'Piaget’ye göre 2–7 yaş aralığı hangi bilişsel gelişim dönemidir?',options:['Duyusal motor dönem','İşlem öncesi dönem','Somut işlemler dönemi','Soyut işlemler dönemi'],correct:1,explanation:'Piaget’nin kuramında 2–7 yaş işlem öncesi dönemdir.'}]}];
let step='courses',course=null,year=null,type=null,index=0,score=0,locked=false;const el=document.getElementById('content'),back=document.getElementById('back');function title(t,desc=''){el.innerHTML='<h2>'+t+'</h2>'+(desc?'<p class="muted">'+desc+'</p>':'')}function add(label,fn){const b=document.createElement('button');b.className='primary';b.textContent=label;b.onclick=fn;el.appendChild(b)}function render(){back.classList.toggle('hidden',step==='courses');if(step==='courses'){title('Ders Seçimi','Şimdilik yalnızca örnek ders bulunuyor.');courses.forEach(c=>add(c.name+' • '+c.term,()=>{course=c;step='years';render()}))}else if(step==='years'){title('Sınav Yılı',course.name);[...new Set(exams.filter(e=>e.course===course.id).map(e=>e.year))].sort((a,b)=>b-a).forEach(y=>add(String(y),()=>{year=y;step='types';render()}))}else if(step==='types'){title('Sınav Türü',course.name+' • '+year);['Vize','Final'].forEach(t=>{const found=exams.find(e=>e.course===course.id&&e.year===year&&e.type===t);if(found)add(t+' • '+found.questions.length+' soru',()=>{type=t;index=0;score=0;step='test';render()});else{const p=document.createElement('p');p.className='muted';p.textContent=t+' • Henüz soru eklenmedi';el.appendChild(p)}})}else if(step==='test'){const exam=exams.find(e=>e.course===course.id&&e.year===year&&e.type===type);if(index>=exam.questions.length){step='result';render();return}const q=exam.questions[index];locked=false;title('Örnek Test','Gerçek çıkmış soru değildir');const prog=document.createElement('div');prog.className='progress';prog.textContent=(index+1)+' / '+exam.questions.length+' soru';el.appendChild(prog);const h=document.createElement('h3');h.textContent=q.q;el.appendChild(h);const feedback=document.createElement('p');q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+') '+o;b.onclick=()=>{if(locked)return;locked=true;if(i===q.correct)score++;el.querySelectorAll('.option').forEach((btn,j)=>{btn.disabled=true;if(j===q.correct)btn.classList.add('correct');else if(j===i)btn.classList.add('wrong')});feedback.textContent=(i===q.correct?'✅ Doğru! ':'❌ Yanlış. ')+q.explanation;next.classList.remove('hidden')};el.appendChild(b)});el.appendChild(feedback);const next=document.createElement('button');next.className='primary hidden';next.textContent=index===exam.questions.length-1?'Sonuçları Gör':'Sonraki Soru →';next.onclick=()=>{index++;render()};el.appendChild(next)}else if(step==='result'){const exam=exams.find(e=>e.course===course.id&&e.year===year&&e.type===type);title('Test Sonucu');const p=document.createElement('p');p.textContent='Doğru: '+score+' / '+exam.questions.length+' • Puan: '+Math.round(score/exam.questions.length*100);el.appendChild(p);add('Testi tekrar çöz',()=>{index=0;score=0;step='test';render()});add('Derslere dön',()=>{step='courses';render()})}}back.onclick=()=>{step=step==='years'?'courses':step==='types'?'years':step==='test'?'types':'courses';render()};render();
</script></body></html>
