<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUZEF 2024–2025 Vize B / Sınav 1</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f2f5fb;color:#152238;margin:0}main{max-width:650px;margin:auto;padding:22px 15px 45px}header{background:#193b75;color:white;padding:22px;border-radius:15px;margin-bottom:18px}h1{font-size:23px;margin:0 0 8px}.card{background:white;border-radius:15px;padding:20px;box-shadow:0 2px 12px #10204415}.muted{color:#64748b;font-size:14px}.option{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:13px;margin:9px 0;font:inherit;line-height:1.45;cursor:pointer}.option:disabled{color:#152238;opacity:1}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}#next,#restart{background:#193b75;color:white;border:0;padding:14px 20px;border-radius:10px;font:inherit;cursor:pointer;margin-top:12px}#feedback{font-weight:700;min-height:24px}#question{font-size:18px;line-height:1.5;white-space:pre-line}#result{display:none}li{margin:12px 0;line-height:1.5}</style></head><body><main><header><h1>📘 AUZEF Soru Bankam</h1><div>Okul Öncesi Eğitim Programları-I</div><strong>2024–2025 Vize B / Sınav 1</strong></header><section class="card" id="quiz"><p id="progress" class="muted"></p><h2 id="question"></h2><div id="options"></div><p id="feedback" aria-live="polite"></p><button id="next" style="display:none">Sonraki soru →</button></section><section class="card" id="result"><h2>Test sonucu</h2><p id="score"></p><h3>Yanlış / boş cevaplar</h3><ol id="review"></ol><button id="restart">Yeniden başla</button></section><p class="muted">Kaynak: Kullanıcının paylaştığı 2024–2025 Vize B / Sınav 1 görselleri ve cevap anahtarı.</p></main><script id="data" type="application/json">[{"q": "Öğrenme merkezlerine ilişkin olarak aşağıdakilerden hangisi yanlıştır?", "options": ["Kazanım ve göstergeler doğrultusunda seçilmiş materyaller barındırırlar.", "Öğrenme merkezlerine güncellenmiş Okul Öncesi Eğitim Programı’nda ilgi köşeleri denilmiştir.", "Çocukların serbest oyun ihtiyacını karşılarlar.", "Öğrenme merkezleri birbirinden ayrılmalıdır.", "Çocuklar öğrenme merkezlerinde bir yetişkine ihtiyaç duymadan çalışma olanağı elde ederler."], "answer": 1}, {"q": "Aşağıdakilerden hangisi uzaktan aile eğitiminde kullanılan kitle iletişim araçlarının dört etki düzeyinden biri değildir?", "options": ["Farkındalık yaratmak", "Bilgilendirmek", "Eğitmek", "Harekete geçirmek", "Dinlendirmek"], "answer": 4}, {"q": "Aşağıdakilerden hangisi sosyal ve duygusal gelişimi destekleyen öğrenme ortamlarının özelliklerinden değildir?", "options": ["Teknolojik materyaller içermesi", "Estetik açıdan cazip olması", "Sınıfta çeşitliliği ve farklılığı yansıtan düzenlemeler olması", "Çocukların bireysel veya grup olarak çalışma yapabilecekleri alanlar bulundurması", "Küçük grup çalışmalarına izin veren materyaller sunması"], "answer": 0}, {"q": "Günlük akış içindeki rutin etkinliklerin yeri ve süresi zaman zaman değiştirilebilir. Bu durum günlük akışla ilgili aşağıdaki ilkelerden hangisiyle açıklanır?", "options": ["Değişkenlik", "Duyarlılık", "Uyumluluk", "Esneklik", "Dengelilik"], "answer": 3}, {"q": "Çocuklara kazandırılması planlanan amaçlar olup eğitim durumlarına yol gösterirler ve davranış türlerine göre kendi içerisinde üçe ayrılırlar. Yukarıda bahsedilen amaç türü aşağıdakilerden hangisidir?", "options": ["Bilişsel amaç", "Uzak amaç", "Sosyal amaç", "Özel amaç", "Genel amaç"], "answer": 3}, {"q": "Aşağıdakilerden hangisi 0-8 yaş çocuklarına yönelik geliştirilen sanat programlarında göz önünde bulundurulan ilkelerden biri değildir?", "options": ["Çocukları öğrenmeye, araştırmaya, duyusal keşiflere davet eden zengin materyal çeşitliliğine sahip ortamlar tasarlanmalıdır.", "Çocukların farklı becerilerine, ilgi alanlarına, fikirlere, kültürel deneyimlerine kıymet verilmelidir.", "Çocuklara, daha çok yapılandırılmış sanat deneyimleri ve küçük-grup etkinlikleri sunulmalıdır.", "Çocuklara sanat materyallerini keşfetmeleri ve sanat deneyimleri için zaman verilmelidir.", "Çocukları dikkatle gözleyen, dinleyen ve değerlendirmelerde bulunan duyarlı öğretmenler bulunmalıdır."], "answer": 2}, {"q": "Aşağıdakilerden hangisi bilişsel gelişime yönelik hazırlanan programda eğitimcilerin rol ve görevlerinden biri değildir?", "options": ["Bilişsel deneyimleri günlük rutinle birleştirmek.", "Bilişsel uyaranlar açısından zengin bir ortam oluşturmak.", "Bilişi destekleyecek gerçek deneyimler sunmak.", "Küçük grup ya da büyük grup etkinlikleri planlamak.", "Bilişsel kavramları detaylıca anlatmak ve ders vermek."], "answer": 4}, {"q": "Küçük Çocukların Eğitimi Ulusal Birliği, ölçme ve değerlendirme süreçleriyle ilgili temel bazı ilkeler belirlemiştir. Buna göre bir okulun kendi ölçme planını oluşturmaması, bu ilkelerin hangisinin ihlaliyle açıklanabilir?", "options": ["Ölçme sonuçları bildirilmeli ve paylaşılmalıdır.", "Ölçme, öğretim süreci ve programla bütünleştirilmelidir.", "Ölçme, sistematik ve sürekli olmalıdır.", "Ölçme, geçerli ve güvenilir olmalıdır.", "Ölçme, amaçlı ve stratejik olmalıdır."], "answer": 2}, {"q": "Aşağıdakilerden hangisi psikomotor gelişim alanına yönelik hazırlanan programların geliştirmeyi hedeflediği becerilerdendir?", "options": ["Eleştirel düşünme becerisi edinme", "Duyguları uygun şekilde ifade etme", "Prososyal davranış geliştirme", "Uzamsal farkındalık geliştirme", "Kendi düşünce süreçlerini açıklama"], "answer": 3}, {"q": "Uyumlu ve huzurlu bir sınıf ortamı için öğretmenin, çocukların her biriyle kurduğu etkileşimde olumlu rol model olması önemlidir. Aşağıdakilerden hangisi öğretmenin rol model olabileceği durumlara örnek değildir?", "options": ["Diğer yetişkinlerle kibar ilişki kurmaya model olmak.", "Sözlü olmayan görgü kurallarına model olmak.", "Yumuşak ve sakin konuşmaya model olmak.", "Sözlü nezaket kelimelerine model olmak.", "Duyguları anlamaya model olmak."], "answer": 4}, {"q": "Okuryazarlığın beş genel evresi ile ilgili aşağıdakilerden hangisi yanlıştır?", "options": ["Beşinci ve son evre, akıcı okuma ve yazma evresidir.", "Üçüncü evre, okuma ve yazmaya başlama aşamasıdır ve bu evrede çocuklar akıcı bir şekilde okumayı kavramışlardır.", "Dördüncü evrede çocukların çoğu akıcı okumaya başlar.", "İkinci evrede çocuk, kendiliğinden gelişen okuryazarlık evresindedir ve harfleri biçimsel olarak yazabilir.", "İlk evre, erken kendiliğinden gelişen okuryazarlık evresi olarak adlandırılmaktadır."], "answer": 1}, {"q": "Aşağıdakilerden hangisi okul öncesi eğitim programlarında program geliştirmeyi etkileyen temel faktörlerden biri değildir?", "options": ["Okul/kurumla ilgili faktörler", "Sosyal ve kültürel faktörler", "Risklerle ilgili faktörler", "Öğretmenle ilgili faktörler", "Çocukla ilgili faktörler"], "answer": 2}, {"q": "Aşağıdaki seçeneklerden hangisinde son yüzyılda özel gereksinimli çocuklara ilişkin anlayış en doğru şekilde ifade edilmiştir?", "options": ["“Özel eğitim çocukları” olarak ayrılmalıdır.", "Okulları ayrı olmalıdır.", "Evlerinde oturmalıdır.", "Kendileri gibi özel gereksinimli akranları ile birlikte eğitim görmelidir.", "Toplumun aktif bir üyesi olmalıdır."], "answer": 4}, {"q": "Çocuklar gün boyunca pek çok geçiş zamanı yaşarlar. Bu geçişlerden bazıları büyük dikey geçişlerdir; bazıları ise daha yumuşak ve yatay geçişlerdir. Aşağıdakilerden hangisi yumuşak ve yatay geçişe örnektir?", "options": ["Sınıftan yemekhaneye geçmek.", "Dinlenme zamanından yemek yeme zamanına geçmek.", "Bahçeden içeriye geçmek.", "Sanat etkinliğinden fen-doğa etkinliğine geçmek.", "Evden okula gelmek."], "answer": 3}, {"q": "5 yaşındaki oğlu Murat için anaokulu arayan Ayşe, arkadaşlarının tavsiyesi üzerine Tatlı Şeker Anaokulu’nu ziyarete gitmiştir. Okul yönetimi ile görüştükten sonra anaokulundan ayrılan Ayşe, okulun hemen arkasında baz istasyonu olduğunu fark etmiş, Murat için yeni bir anaokulu aramaya karar vermiştir. Yukarıdaki örnek olay göz önüne alındığında Tatlı Şeker Anaokulu’nun öğrenme ortamları düzenlenirken hangi hususu gözden kaçırdığı söylenebilir?", "options": ["Uzaklık", "Toplu taşıma", "Sağlık ve güvenlik", "Estetik", "Yakınlık"], "answer": 2}, {"q": "Aşağıdakilerden hangisi okulların özel gereksinimli çocuklar ile ilgili görevlerini yerine getirebilmesi için sahip olması gereken özelliklerden biri değildir?", "options": ["Mesleki gelişim", "Aile katılımı", "Kaynaştırma", "Müdahale sistemleri", "Sahiplenme"], "answer": 1}, {"q": "Aile eğitim programlarının uygulanmasında temel amaç aşağıdakilerden hangisidir?", "options": ["Anne-babalara gelişim sorunlarına müdahale yöntemlerini öğretmek.", "Anne babaların çocuk yetiştirme konusundaki bilgilerini değerlendirmek.", "Anne-babaların etkili ebeveynlik becerilerini desteklemek.", "Anne-babaların tutumlarının farkına varmasını sağlamak.", "Anne-babalara çocuk yetiştirme konusunda bilgi vermek."], "answer": 1}, {"q": "Okul öncesi öğretmenlerinin bazı özellikleri, çocuklarla kuracakları etkileşim ve iletişimde de başarılı olmaları açısından önemlidir. Aşağıdakilerden hangisi bu özelliklerden değildir?", "options": ["Ağırbaşlılık", "Sabır", "Heyecan", "İçtenlik", "Esneklik"], "answer": 0}, {"q": "Bir okulda öğretmen sık sık çocukları gözlemlemektedir. Bu öğretmen, yaptığı gözlemleri çocukların dosyalarında biriktirir ancak gözlem sonuçlarından yararlanarak programı ve etkinlikleri düzenlemezse ölçme ve değerlendirmeyle ilgili hangi ilkeyi ihlal etmiş olur?", "options": ["Ölçme, öğretim süreci ve programla bütünleştirilmelidir.", "Ölçme, sistematik ve sürekli olmalıdır.", "Ölçme, amaçlı ve stratejik olmalıdır.", "Ölçmenin sonuçları bildirilmeli ve paylaşılmalıdır.", "Ölçme, geçerli ve güvenilir olmalıdır."], "answer": 0}, {"q": "Aşağıda çağdaş eğitim program yaklaşımı ile ilgili verilen bilgilerden hangisi yanlıştır?", "options": ["Yaş grupları kesin biçimde ayrılmıştır.", "Programlar çocuk merkezlidir.", "Çocuklar programda karar vericidir.", "Öğretmen sınıfta güçlükle fark edilir.", "Programlar esnek bir yapıya sahiptir."], "answer": 0}]</script><script>const questions=JSON.parse(document.getElementById('data').textContent);let i=0,score=0,wrong=[],chosen=false;const $=id=>document.getElementById(id);function render(){chosen=false;const q=questions[i];$('progress').textContent=`Soru ${i+1} / ${questions.length} · Doğru: ${score}`;$('question').textContent=q.q;$('options').innerHTML='';$('feedback').textContent='';$('next').style.display='none';q.options.forEach((o,j)=>{const b=document.createElement('button');b.className='option';b.textContent='ABCDE'[j]+') '+o;b.onclick=()=>choose(j);$('options').appendChild(b)})}function choose(j){if(chosen)return;chosen=true;const q=questions[i],ok=j===q.answer;if(ok)score++;else wrong.push({n:i+1,q:q.q,selected:'ABCDE'[j],correct:'ABCDE'[q.answer],answer:q.options[q.answer]});[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===q.answer)b.classList.add('correct');else if(k===j)b.classList.add('wrong')});$('feedback').textContent=ok?'✓ Doğru cevap!':`✗ Yanlış. Doğru cevap: ${'ABCDE'[q.answer]}`;$('next').style.display='inline-block';$('next').textContent=i===questions.length-1?'Sonuçları gör →':'Sonraki soru →'}$('next').onclick=()=>{i++;if(i<questions.length)render();else{ $('quiz').style.display='none';$('result').style.display='block';$('score').textContent=`${questions.length} soruda ${score} doğru, ${questions.length-score} yanlış · Puan: ${Math.round(score/questions.length*100)}/100`;const r=$('review');r.innerHTML='';if(!wrong.length){r.textContent='Tebrikler, tüm cevaplar doğru!'}else wrong.forEach(w=>{const li=document.createElement('li');li.textContent=`${w.n}. soru: ${w.q} — İşaretlediğin: ${w.selected}; Doğru: ${w.correct}) ${w.answer}`;r.appendChild(li)})}window.scrollTo(0,0)};$('restart').onclick=()=>{i=0;score=0;wrong=[];$('result').style.display='none';$('quiz').style.display='block';render();window.scrollTo(0,0)};render();</script></body></html>
