let view='home',active=null,index=0,chosen={},revealed=false,reviewOnly=false;
let history=JSON.parse(localStorage.getItem('auzefHistory')||'[]');
const root=document.getElementById('root');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(view==='home'){root.innerHTML=`<section class="panel"><h2>Ders Seçimi</h2><button class="primary" onclick="view='years';render()">Çocuk Hakları ve Hukuku</button><p class="muted">Diğer 3. sınıf dersleri sonraki sürümlerde eklenecek.</p></section>`;return}
if(view==='stats'){showStats();return}
if(view==='years'){root.innerHTML=`<button class="light" onclick="view='home';render()">← Geri</button><section class="panel"><h2>Çocuk Hakları ve Hukuku</h2><p class="muted">Eğitim yılına göre vize testleri</p>${['2025-2026','2024-2025','2023-2024','2022-2023'].map(y=>`<button class="primary" onclick="start('${y}')">${y} Güz Vize • 20 soru</button>`).join('')}<hr><button class="primary" onclick="start('karma')">🔀 Karma Sorular • 20 soru</button><button class="light" style="width:100%" onclick="showStats()">📊 İstatistikler</button><p class="notice">Sınav kitapçıklarının soruları görsel üzerinden sunulur. Görselleri yakınlaştırarak okuyabilirsin. Cevap anahtarları paylaşılan kaynaklara göredir.</p></section>`;return}
let q=active[index],isK=active===KARMA,ans=isK?'ABCDE'[q.correct]:q.answer;let choice=chosen[index];let header=`<button class="light" onclick="view='years';render()">← Sınavlara dön</button><section class="panel"><div class="top"><b>${isK?'Karma Sorular':q.year+' Vize'}</b><span>${index+1} / ${active.length}</span></div><p class="muted">${isK?'Karma çalışma dosyası':q.year+' • '+q.number+'. soru'}</p>`;
let question=isK?`<h2>${esc(q.question)}</h2>${q.options.map((o,i)=>`<button class="opt ${revealed&&i===q.correct?'right':''} ${revealed&&choice==='ABCDE'[i]&&i!==q.correct?'wrong':''} ${choice==='ABCDE'[i]?'chosen':''}" onclick="choose('${'ABCDE'[i]}')">${'ABCDE'[i]}) ${esc(o)}</button>`).join('')}`:`<p class="muted">Soru ${q.number}: Aşağıdaki kaynak görselinden ilgili soruyu bulup okuyun.</p><p class="notice">Bu sınavda soru metni kaynak kitapçık görselindedir. Her sorunun doğru cevabı ayrıca kontrol edilebilir.</p><div class="scroll"><img class="scan" src="${esc(q.image)}" alt="${q.year} sınav kitapçığı, soru ${q.number}" onerror="this.outerHTML='<p class=notice>Görsel yüklenemedi. GitHub’a görsel dosyalarını da yüklemelisin.</p>'"></div><div class="answers">${'ABCDE'.split('').map(a=>`<button class="${choice===a?'selected':''} ${revealed&&a===ans?'correct':''} ${revealed&&choice===a&&a!==ans?'incorrect':''}" onclick="choose('${a}')">${a}</button>`).join('')}</div>`;
root.innerHTML=header+question+`<div style="margin-top:14px">${revealed?`<p class="stat">${choice===ans?'✅ Doğru!':'❌ Yanlış.'} Doğru cevap: ${ans}</p>`:`<button class="primary" onclick="reveal()" ${!choice?'disabled style="opacity:.5"':''}>Cevabı kontrol et</button>`}<div class="top"><button class="light" onclick="move(-1)">← Önceki</button><button class="light" onclick="move(1)">${index===active.length-1?'Sonuçlar':'Sonraki →'}</button></div></div></section>`;
}
function start(y){active=y==='karma'?KARMA:EXAMS.filter(q=>q.year===y);index=0;chosen={};revealed=false;reviewOnly=false;view='test';render()}
function choose(a){chosen[index]=a;revealed=false;render()}
function reveal(){revealed=true;render()}
function showStats(){view='stats';const total=history.length;root.innerHTML=`<button class="light" onclick="view='years';render()">← Geri</button><section class="panel"><h2>📊 İstatistikler</h2><p>Bitirilen test: ${total}</p>${history.slice(-15).reverse().map(h=>`<p class="pill">${esc(h.name)} — ${h.correct}/${h.total} doğru • ${h.blank} boş</p>`).join('')||'<p>Henüz tamamlanan test yok.</p>'}<button class="light" onclick="if(confirm('İstatistikleri silmek istiyor musun?')){history=[];localStorage.removeItem('auzefHistory');showStats()}">İstatistikleri sıfırla</button></section>`}
function finish(){const total=active.length;const correct=active.filter((q,i)=>chosen[i]===(active===KARMA?'ABCDE'[q.correct]:q.answer)).length;const blank=active.filter((q,i)=>!chosen[i]).length;const wrong=total-correct-blank;const wrongIds=active.map((q,i)=>({q,i})).filter(({q,i})=>chosen[i] && chosen[i] !== (active===KARMA?'ABCDE'[q.correct]:q.answer)).map(({i})=>i);const name=active===KARMA?'Karma Sorular':active[0].year+' Vize';history.push({name,total,correct,blank,wrong,date:new Date().toISOString()});localStorage.setItem('auzefHistory',JSON.stringify(history));const missed=active.filter((q,i)=>chosen[i] !== (active===KARMA?'ABCDE'[q.correct]:q.answer));root.innerHTML=`<button class="light" onclick="view='years';render()">← Sınavlar</button><section class="panel"><h2>🎯 Test sonucu</h2><p class="stat">${correct} doğru · ${wrong} yanlış · ${blank} boş</p><h2>Başarı: %${Math.round(correct/total*100)}</h2><button class="primary" onclick="index=0;chosen={};revealed=false;render()">🔁 Testi tekrar çöz</button><button class="primary" onclick="startWrong()" ${missed.length?'':'disabled'}>❌ Yanlış ve boş soruları çalış (${missed.length})</button><button class="light" onclick="showStats()">📊 İstatistikler</button></section>`;window._missed=missed}
function startWrong(){if(!window._missed?.length)return;active=window._missed;index=0;chosen={};revealed=false;view='test';render()}
function move(d){if(index+d<0)return;if(index+d>=active.length){finish();return}index+=d;revealed=false;render()}
render();
</script></body></html>
