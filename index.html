<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#304fb1"><title>AUZEF Soru Bankam</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f3fa;color:#23314e;font:16px system-ui,-apple-system,Arial,sans-serif}header{background:#304fb1;color:white;text-align:center;padding:28px 16px}header h1{font-size:clamp(25px,6vw,36px);margin:0 0 8px}header p{margin:0;opacity:.9}main{max-width:700px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 15px #1727470a}h2{margin:8px 0 12px;font-size:24px}p{line-height:1.5}.muted{color:#66738d}.choice{display:block;width:100%;background:#304fb1;color:#fff;border:0;border-radius:12px;padding:16px;margin:10px 0;text-align:left;font-size:16px;line-height:1.35;cursor:pointer}.choice:disabled{background:#aab3c9;cursor:not-allowed}.back{background:#e9eef9;color:#304fb1;border:0;border-radius:10px;padding:12px 16px;font-size:16px;margin-bottom:12px;cursor:pointer}.pill{font-size:13px;color:#5a6781;background:#eef1f8;border-radius:30px;padding:5px 10px;display:inline-block}.notice{border-left:4px solid #304fb1;padding-left:12px}.tiny{font-size:13px}a{color:#304fb1}footer{text-align:center;padding:4px 20px 25px;color:#66738d;font-size:13px}</style></head><body>
<header><h1>📚 AUZEF Soru Bankam</h1><p>Çocuk Gelişimi • 3. Sınıf • Güz (5. Yarıyıl)</p></header><main id="app"></main><footer>Bağımsız çalışma uygulamasıdır; İstanbul Üniversitesi'nin resmî uygulaması değildir.</footer>
<script>
'use strict';
const courses=[
'Çocuk Hakları ve Hukuku',
'Koruyucu Ruh Sağlığı ve Dayanıklılık',
'Okul Öncesi Eğitim Programları-I',
'Psikometrik – Gelişimsel Ölçme ve Değerlendirme',
'Sosyal-Duygusal Gelişim',
'Üstün Zekâlı ve Yetenekli Çocuklar ve Eğitimleri'
];
// Verified past-exam questions may be added here later.
// Format: {course:0,year:2025,type:'Vize',question:'...',options:['A','B','C','D'],correct:1,source:'...'}
const questionBank=[];
const years=[2026,2025,2024,2023,2022,2021,2020];
let page='courses',courseIndex=null,year=null,exam=null,questionIndex=0,answers=[];
const app=document.getElementById('app');
function el(tag,text,cls,click){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;if(click)node.addEventListener('click',click);return node;}
function card(title,subtitle){const c=el('section',undefined,'card');c.append(el('h2',title));if(subtitle)c.append(el('p',subtitle,'muted'));app.append(c);return c;}
function btn(parent,label,fn,disabled=false){const b=el('button',label,'choice',fn);b.disabled=disabled;parent.append(b);return b;}
function back(target){const b=el('button','← Geri','back',()=>{page=target;render();});app.append(b);}
function info(){const c=card('Bilgilendirme');c.append(el('p','Ders adları İstanbul Üniversitesi resmî müfredatından alınmıştır. Yıllar arşiv başlığıdır; bu yılların tamamı için çıkmış soru bulunduğu anlamına gelmez. Sorular yalnızca kaynak ve cevap anahtarı doğrulandıktan sonra eklenecektir.','muted notice'));const a=el('a','Resmî ders programını görüntüle');a.href='https://ebs.istanbul.edu.tr/home/dersprogram/?birim=cocuk_gelisimi__lisans_programi__&id=10669';a.target='_blank';a.rel='noopener noreferrer';c.append(a);}
function filtered(){return questionBank.filter(q=>q.course===courseIndex&&q.year===year&&q.type===exam);}
function render(){app.replaceChildren();if(page==='courses'){const c=card('Ders Seçimi','3. sınıf güz dönemi • 6 zorunlu ders');courses.forEach((name,i)=>btn(c,name,()=>{courseIndex=i;page='years';render();}));info();}
else if(page==='years'){back('courses');const c=card('Sınav Yılı',courses[courseIndex]);years.forEach(y=>btn(c,String(y),()=>{year=y;page='exams';render();}));c.append(el('p','Yıllar arşiv düzeni için listelenmiştir.','muted tiny'));}
else if(page==='exams'){back('years');const c=card('Sınav Türü',courses[courseIndex]+' • '+year);['Vize','Final'].forEach(t=>{const count=questionBank.filter(q=>q.course===courseIndex&&q.year===year&&q.type===t).length;btn(c,t+(count?' • '+count+' soru':' • Henüz soru eklenmedi'),()=>{exam=t;page='test';questionIndex=0;answers=[];render();});});}
else if(page==='test'){back('exams');const list=filtered();const c=card(exam+' Testi',courses[courseIndex]+' • '+year);if(!list.length){c.append(el('p','Bu dersin '+year+' '+exam.toLowerCase()+' sınavına ait doğrulanmış sorular henüz eklenmedi.','muted'));c.append(el('p','Gerçek çıkmış soru ve cevap anahtarları doğrulandıktan sonra bu bölümden test çözebileceksin.','tiny'));return;}if(questionIndex>=list.length){const correct=list.filter((q,i)=>answers[i]===q.correct).length;c.append(el('h2','Test tamamlandı'));c.append(el('p',correct+' / '+list.length+' doğru • %'+Math.round(correct/list.length*100)+' başarı'));btn(c,'Testi yeniden çöz',()=>{questionIndex=0;answers=[];render();});return;}const q=list[questionIndex];c.append(el('p',(questionIndex+1)+' / '+list.length+' soru','muted'));c.append(el('h2',q.question));q.options.forEach((opt,i)=>btn(c,String.fromCharCode(65+i)+') '+opt,()=>{answers[questionIndex]=i;questionIndex++;render();}));if(q.source)c.append(el('p','Kaynak: '+q.source,'muted tiny'));}
}render();
</script></body></html>
