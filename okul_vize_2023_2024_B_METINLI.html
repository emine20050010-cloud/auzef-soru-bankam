<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2023–2024 Vize B | AUZEF Soru Bankam</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#17253b;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:0 auto;padding:18px}header{background:#172d52;color:white;padding:22px 18px;border-radius:16px;margin-bottom:18px}h1{font-size:22px;margin:0 0 8px}header p{margin:0;opacity:.88}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 14px #14294a13}.muted{color:#60718a}.progress{height:9px;background:#e5ebf4;border-radius:12px;overflow:hidden;margin:12px 0 22px}.bar{height:100%;background:#3572c9;width:0;transition:width .2s}.question{white-space:pre-line;font-size:18px;font-weight:650;line-height:1.5;margin:16px 0 22px}.option{display:block;width:100%;text-align:left;border:1.5px solid #d6deeb;background:#fff;border-radius:12px;padding:14px;margin:9px 0;font:inherit;line-height:1.45;color:inherit;cursor:pointer}.option:disabled{opacity:1;cursor:default}.option.correct{background:#e6f7ed;border-color:#24844c}.option.wrong{background:#fff0f0;border-color:#c84545}.option b{margin-right:9px}.feedback{font-weight:650;margin:16px 0}.primary{border:0;background:#235db4;color:white;border-radius:12px;padding:13px 18px;font:inherit;font-weight:650;cursor:pointer}.primary:disabled{opacity:.45}.hidden{display:none}.review{padding:14px 0;border-bottom:1px solid #e0e6ee;white-space:pre-line}.review p{margin:8px 0}small{color:#64748b}button:focus-visible{outline:3px solid #7daeff;outline-offset:2px}</style></head><body><main><header><h1>📘 AUZEF Soru Bankam</h1><p>Okul Öncesi Eğitim Programları-I · 2023–2024 Vize B · 20 gerçek soru</p></header>
<section id="intro" class="card"><h2>2023–2024 Vize B</h2><p>20 soruyu sırayla cevapla. Her sorudan sonra doğru yanıtı göreceksin. Test bitince puanın ve yanlışların listelenecek.</p><button class="primary" id="start">Testi başlat</button></section>
<section id="quiz" class="card hidden"><div id="count" class="muted"></div><div class="progress"><div class="bar" id="bar"></div></div><div id="question" class="question"></div><div id="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><button id="next" class="primary hidden">Sonraki soru</button></section>
<section id="result" class="card hidden"><h2>Test sonucu</h2><p id="score"></p><div id="review"></div><button class="primary" id="restart">Tekrar çöz</button></section>
</main><script type="application/json" id="questions">[{"q": "Yeryüzündeki tüm dillerde kullanılan konuşma seslerinin dizisel ve dizimsel ilişkisini belirleyen kuralları, doğal özellikleri içerisinde inceleyen bilim dalıdır.\n\nYukarıda tanımlanan dil sistemi aşağıdakilerden hangisidir?", "options": ["Sintax", "Pragmatik", "Morfoloji", "Fonoloji", "Semantik"], "answer": "D"}, {"q": "Aşağıdakilerden hangisi okul öncesi eğitim programlarında amaç türlerinden biri değildir?", "options": ["Eğilimlerle ilgili amaçlar", "Bilgi/anlayışla ilgili amaçlar", "Becerilerle ilgili amaçlar", "Sürdürülebilirlikle ilgili amaçlar", "Duygularla ilgili amaçlar"], "answer": "D"}, {"q": "Bir öğretmen psikomotor gelişime yönelik hazırladığı programda çocuklara seçme hakkı tanımakta, gelişimsel ihtiyaçları doğrultusunda etkinlikleri uyarlamakta ve etkinliklere kendisi de katılım göstermektedir. Buna göre aşağıdaki özelliklerden hangisi öğretmenin bu uygulamasıyla öncelikle ilişkilendirilebilir?", "options": ["Hareket etkinlikleri çocukların oyun deneyimlerini destekler.", "Öğretmenler rehber ve kolaylaştırıcı görevi üstlenirler.", "Çocuklar çevreleriyle etkileşim hâlinde öğrenirler.", "Program çocukların bireysel gelişim seviyelerine uygundur.", "Çocuklar bütüncül bir şekilde öğrenir ve gelişirler."], "answer": "B"}, {"q": "Aşağıdakilerden hangisi erken çocukluk eğitimcilerinin program geliştirme sürecinde uyması gereken etik ilkelerden biri değildir?", "options": ["Her çocukta \"yapabilirim\" hissiyatını uyandırmak", "Her bireyin onuru, değeri ve eşsizliğine saygı göstermek", "Çocuğun nasıl öğrendiği ve geliştiği bilgisini tüm çalışmaların temeli haline getirmek", "Aileler, çocuklar ve meslektaşların çeşitliliğine saygı göstermek", "Fiziksel aktivite ve oyunu gün boyunca etkinliklerin içerisine entegre etmek"], "answer": "E"}, {"q": "Okul servisine binmek için erkenden sokağa çıkan Ali’ye annesi “Servis daha gelmedi mi?” şeklinde bir soru sormuş ve Ali’den “Hayır gelmedi daha geç.” yanıtını almıştır.\n\nYukarıdaki örnek olay göz önüne alındığında Ali’nin hangi dil sisteminde yanlış yaptığı söylenebilir?", "options": ["Fonoloji", "Pragmatik", "Morfoloji", "Semantik", "Sintax"], "answer": "C"}, {"q": "Aşağıdakilerden hangisi psikomotor alana yönelik hazırlanan bir program kapsamında çevre/ortam düzenleme ilkelerinden biri değildir?", "options": ["Fiziksel mekânı oyun ve motor becerileri destekleyecek nitelikte düzenlemek", "Motor becerileri destekleyecek nitelikte materyaller bulundurmak", "Ortam ve materyalleri çocukların aile kültürlerine, geleneklerine uygun şekilde tasarlamak", "Çocukların güvenliği açısından yalnızca bahçeyi motor faaliyetlere uygun şekilde düzenlemek", "Oyun alanlarında bulunan araç gereçleri güvenlik açısından sık sık denetlemek"], "answer": "D"}, {"q": "I. Sınıf yönetiminin nasıl sağlanacağı\nII. Özel gereksinimli çocuklar için neler yapılacağı\nIII. İç ve dış mekânlarda öğrenme ortamlarının nasıl düzenleneceği\nIV. Öğretmenin yeterliliklerinin nasıl destekleneceği\n\nYukarıdakilerden hangisi veya hangileri okul öncesi eğitim programının planlama yaptığı konulardandır?", "options": ["Yalnız II", "I, II ve III", "II, III ve IV", "II ve III", "Yalnız III"], "answer": "B"}, {"q": "Bir öğretmen sınıfa çeşitli boyutlarda mıknatıslar, demir, bakır ve alüminyum materyaller getirmiştir. Çocukların bu materyalleri incelemelerini ve keşfetmelerini teşvik etmek üzere materyalleri büyük grup zamanında tanıtmıştır.\n\nBuna göre bu öğretmen fen ve doğa programı kapsamında öncelikle hangi alana yönelik program geliştirmektedir?", "options": ["Yaşam bilimi", "Ekoloji", "Fiziksel bilim", "Dünya ve uzay bilimi", "Sorgulama ve araştırma olarak bilim"], "answer": "C"}, {"q": "Aşağıdakilerden hangisinin çocuk-merkezli bir programda gözlenmesi beklenemez?", "options": ["Çocukların inisiyatif alması teşvik edilir.", "Etkinlikler, çocuklar tarafından başlatılır.", "Doğrudan öğretim yöntemleri sık kullanılır.", "Eğitimcinin rolü, ipucu vermek ve rehberlik etmektir.", "Çocukların ilgi ve ihtiyaçlarına odaklanılır."], "answer": "C"}, {"q": "Aşağıdakilerden hangisi 0-8 yaş çocuklarına yönelik geliştirilen sanat programlarında göz önünde bulundurulan ilkelerden biri değildir?", "options": ["Çocukları öğrenmeye, araştırmaya, duyusal keşiflere davet eden zengin materyal çeşitliliğine sahip ortamlar tasarlanmalıdır.", "Çocukları dikkatle gözleyen, dinleyen ve değerlendirmelerde bulunan duyarlı öğretmenler bulunmalıdır.", "Çocukların farklı becerilerine, ilgi alanlarına, fikirlere, kültürel deneyimlerine kıymet verilmelidir.", "Çocuklara sanat materyallerini keşfetmeleri ve sanat deneyimleri için zaman verilmelidir.", "Çocuklara, daha çok yapılandırılmış sanat deneyimleri ve küçük-grup etkinlikleri sunulmalıdır."], "answer": "E"}, {"q": "Aşağıdakilerden hangisi bilişsel gelişime yönelik hazırlanan matematik programlarına rehberlik eden ilkelerden biri değildir?", "options": ["Okul öncesi eğitim programında matematik dersi olarak tanımlanabilecek özel bir zaman tasarlanmalıdır.", "Çocuklar matematiksel becerileri kendi hızlarında, bireysel farklılık göstererek edinirler.", "Çocuklar gündelik matematiği doğal ortamda çoğunlukla doğrudan öğretime gerek olmadan edinirler.", "Çocuklar erken yaşlardan itibaren gündelik hayat matematiğiyle ilgilenmektedirler.", "Çocuklar çok küçük yaşlardan itibaren derinlemesine ve detaylı şekilde matematiksel olarak düşünebilirler."], "answer": "A"}, {"q": "Aşağıdakilerden hangisi erken çocukluk eğitim kurumlarında eğitimcilerin rol ve görevlerinden biri değildir?", "options": ["Aile, okul ve toplum iş birliğini sağlamak", "Çocuğun gelişimsel ihtiyaçlarını ve büyümesini temin etmek", "Okul temelli programın güçlü yönlerini kalıcı hâle getirmek", "Gerçek yaşamla ilgili duyusal ve ilginç öğrenme yaşantıları sunmak", "Homojen toplum yapısını dikkate alarak tüm planlamaları buna göre yapmak"], "answer": "E"}, {"q": "Aşağıdakilerden hangisi müzikle ilgili sunulacak sanat deneyimlerinin temel ilke ve standartlarından biri değildir?", "options": ["Farklı kültürlerin müziklerinden örnekler sunulmalıdır.", "Geçerli ve uygun değerlendirme yöntemleri kullanılmalıdır.", "Sesi keşfetmeye yönelik fırsatlar sunulmalıdır.", "Müzik, sanat ve diğer gelişim alanlarıyla bütünleştirilmelidir.", "Çocukların desteğiyle ve öğretmenlerin liderliğinde çalışmalar yapılmalıdır."], "answer": "E"}, {"q": "Aşağıdakilerden hangisi bilişsel gelişime yönelik hazırlanan fen ve doğa programlarında geliştirilmesi hedeflenen temel bilimsel süreç becerilerden biri değildir?", "options": ["Gözlem", "Ölçme", "Sıralama", "Karşılaştırma", "İletişim"], "answer": "C"}, {"q": "Dil ve düşüncenin birlikte geliştiğini kabul eden bilim insanı aşağıdakilerden hangisidir?", "options": ["Piaget", "Chomsky", "Skinner", "Vygotsky", "Bruner"], "answer": "D"}, {"q": "Eğitim programlarında “Bireyleri niçin eğitiyoruz?” sorusunu cevaplayan öge aşağıdakilerden hangisidir?", "options": ["Aile katılımı", "Amaçlar/hedefler/kazanımlar", "Yöntem ve teknikler", "Eğitim ortamı", "Değerlendirme"], "answer": "B"}, {"q": "Okul öncesinde sınıf ortamında çocuk-çocuk, öğretmen-çocuk ve öğretmen-grup ilişkisinin düzenlenmesini içeren program hangi alana yönelik olarak geliştirilmiştir?", "options": ["Fiziksel gelişim", "Sosyal-duygusal gelişim", "Bilişsel gelişim", "Dil gelişimi", "Öğretmen-çocuk etkileşimi"], "answer": "B"}, {"q": "Aşağıdakilerden hangisi sosyal-duygusal gelişime yönelik hazırlanan programda eğitimcilerin planlama yaptığı hususlardan biri değildir?", "options": ["Hareketli oyun etkinliklerinin yapılması", "Rutin ve günlük akışın belirlenmesi", "Sınıf ortamının düzenlenmesi", "Sınıf kurallarının ve beklentilerin oluşturulması", "Kişisel ilişkilerin düzenlenmesi"], "answer": "A"}, {"q": "Aşağıdakilerden hangisi ön yargı karşıtı program geliştirilirken çocuklarda kültürel farkındalık oluşturup farklılıklara saygı uyandırmak için başvurulan stratejilerden biri değildir?", "options": ["Çocukların ön yargı içeren düşüncelerini ortaya çıkarmak ve düzeltmek", "Çocuklarda öz farkındalığı destekleyecek etkinlikleri teşvik etmek", "Çocukların, öğretmenlerin ve ailelerinin fotoğraflarını sınıfta bulundurmak", "Kişilerin hayatlarının birbirine nasıl benzediği ve farklılaştığı konusunda sohbet etmek", "Diğer insanların kişiden farklı duygu ve düşüncelere sahip olabileceklerini hatırlatmak"], "answer": "A"}, {"q": "Aşağıdakilerden hangisi psikomotor gelişim alanına yönelik hazırlanan programların geliştirmeyi hedeflediği becerilerdendir?", "options": ["Uzamsal farkındalık geliştirme", "Prososyal davranış geliştirme", "Eleştirel düşünme becerisi edinme", "Duyguları uygun şekilde ifade etme", "Kendi düşünce süreçlerini açıklama"], "answer": "A"}]</script><script>
'use strict';const questions=JSON.parse(document.getElementById('questions').textContent);const letters=['A','B','C','D','E'];let current=0,selected=[];const el=id=>document.getElementById(id);function show(id){['intro','quiz','result'].forEach(x=>el(x).classList.toggle('hidden',x!==id))}function begin(){current=0;selected=[];show('quiz');render()}function render(){const q=questions[current];el('count').textContent=`Soru ${current+1} / ${questions.length}`;el('bar').style.width=`${100*current/questions.length}%`;el('question').textContent=q.q;el('options').replaceChildren();el('feedback').textContent='';el('next').classList.add('hidden');q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='option';const strong=document.createElement('b');strong.textContent=letters[i]+')';b.append(strong,document.createTextNode(' '+opt));b.addEventListener('click',()=>choose(i));el('options').append(b)})}function choose(i){if(selected[current]!==undefined)return;const q=questions[current],letter=letters[i];selected[current]=letter;[...el('options').children].forEach((b,j)=>{b.disabled=true;if(letters[j]===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});el('feedback').textContent=letter===q.answer?'✓ Doğru cevap!':`✗ Yanlış. Doğru cevap: ${q.answer}`;el('next').textContent=current===questions.length-1?'Sonucu göster':'Sonraki soru';el('next').classList.remove('hidden')}function next(){if(selected[current]===undefined)return;current++;if(current===questions.length)finish();else render()}function finish(){show('result');const correct=questions.filter((q,i)=>selected[i]===q.answer).length;el('score').textContent=`${correct} doğru · ${questions.length-correct} yanlış · ${Math.round(correct/questions.length*100)} puan`;el('review').replaceChildren();questions.forEach((q,i)=>{if(selected[i]===q.answer)return;const div=document.createElement('div');div.className='review';const h=document.createElement('strong');h.textContent=`${i+1}. soru`;const p=document.createElement('p');p.textContent=q.q;const s=document.createElement('small');s.textContent=`Senin cevabın: ${selected[i]||'Boş'} | Doğru: ${q.answer}) ${q.options[letters.indexOf(q.answer)]}`;div.append(h,p,s);el('review').append(div)});if(correct===questions.length)el('review').textContent='Tebrikler! Bütün soruları doğru cevapladın.'}el('start').addEventListener('click',begin);el('restart').addEventListener('click',begin);el('next').addEventListener('click',next);
</script></body></html>
